#################################################
# carson-mac
#################################################
- alias: Office Carson Mac Screen On
  id: 71e32aa0-fd43-4526-90a1-ce259b8715b5
  triggers:
    - trigger: state
      entity_id: sensor.carson_mac_screen_off
      from: "True"
      to: "False"
  actions:
    - action: switch.turn_on
      entity_id: switch.office_studio_monitors

  mode: single

- alias: Office Carson Mac Screen Off
  id: 9b312198-f65c-4928-baef-cac5a7bbc14c
  triggers:
    - trigger: state
      entity_id: sensor.carson_mac_screen_off
      from: "False"
      to: "True"
      for: "00:30:00"
  actions:
    - action: switch.turn_off
      entity_id: switch.office_studio_monitors
  mode: single

- alias: Office Carson Mac Webcam On
  id: 76df93c8-0d42-4050-9da3-7d84847c645c
  triggers:
    - trigger: state
      entity_id: binary_sensor.carson_mac_camera_in_use
      to: "on"
  actions:
    - action: input_select.select_option
      data:
        option: meeting
      target:
        entity_id: input_select.office_state
  mode: queued

- alias: Office Carson Mac Webcam Off
  id: f07773da-30ae-4965-9a5d-4b044fdc3511
  triggers:
    - trigger: state
      entity_id: binary_sensor.carson_mac_camera_in_use
      from: "on"
      to: "off"
  actions:
    - action: input_select.select_option
      data:
        option: normal
      target:
        entity_id: input_select.office_state
  mode: queued

#################################################
# Motion
#################################################
- alias: Office Occupied
  id: a38cc913-a62b-489f-a97b-78666f14e2b7
  triggers:
    - trigger: state
      entity_id: binary_sensor.office_motion_sensor_occupancy
      to: "on"
  actions:
    - action: scene.turn_on
      entity_id: scene.office_active_day

- alias: Office Vacant
  id: 321dc653-ab98-4df4-a52b-bd8069e5d87c
  triggers:
    - trigger: state
      entity_id: binary_sensor.office_motion_sensor_occupancy
      to: "off"
      for: "01:00:00"
  actions:
    - action: scene.turn_on
      entity_id: scene.office_inactive
